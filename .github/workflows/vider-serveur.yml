name: 🧹 Vider le serveur

# À lancer à la main uniquement (onglet Actions), quand l'espace disque
# du serveur est saturé et qu'il faut repartir d'un serveur propre.
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Suppression de tout le contenu du serveur
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set net:max-retries 2
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          echo "--- Contenu avant nettoyage ---"
          cls -1
          glob -a rm -r -f *
          echo "--- Contenu après nettoyage ---"
          cls -1
          bye
          EOF
