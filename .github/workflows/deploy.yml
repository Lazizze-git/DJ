name: 🚀 Mise à jour automatique Lazizze

on:
  push:
    branches:
      - main
  # Permet aussi de relancer le déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: 📂 Envoi vers Infomaniak via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          port: 21
          # Nom changé : force un envoi complet du site au prochain déploiement
          state-name: .deploy-state-v2.json
          # Fichiers de travail qui n'ont rien à faire en ligne
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/Portfolio site design/**
            **/temporary screenshots/**
            **/*.mjs
            **/*.md
            **/package.json
            **/package-lock.json
            **/.DS_Store
            **/*.HEIC
            **/*.heic
